name: Release

# 轮19.86：打 tag（v1.0.0 这种）时自动构建**按 ABI 拆分的发行包**并创建 GitHub Release ✓
# · 每个 ABI 一个 APK（arm64-v8a / armeabi-v7a），不含 universal 合并包 ✓
# · Release 创建用内置 GITHUB_TOKEN ✓；APK 用 **正式密钥签名**（密钥在 Secrets 里，不进仓库 ✓）
#   fork 若没有配置这些 Secrets 会自动回退 debug 签名，仍可构建 ✓
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # sherpa-onnx AAR 不入库（49MB 超 API 限制）⇒ 从官方 release 下载 ✓
      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          curl -sSL --retry 5 --retry-all-errors -o app/libs/sherpa-onnx-1.13.5.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
          ls -la app/libs/

      - name: Build release APKs (per-ABI)
        run: ./gradlew assembleRelease --stacktrace

      # 按 ABI 重命名：app-<abi>-release.apk → oime-<版本>-<abi>.apk
      - name: Rename APKs
        run: |
          set -e
          mkdir -p out
          VER="${GITHUB_REF_NAME#v}"
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            abi=$(echo "$base" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$apk" "out/oime-${VER}-${abi}.apk"
          done
          ls -la out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ○输入法 ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: out/*.apk
          body: |
            ○输入法（Oime）${{ github.ref_name }}

            ## 下载

            | 文件 | 适用 |
            |---|---|
            | `oime-*-arm64-v8a.apk` | 64 位 ARM 机型（2016 年后的绝大多数手机）|

            > 若提示「应用未安装 / 不兼容」，说明设备是 32 位（armeabi-v7a）—— 目前暂不发布该架构。
            > x86 / x86_64 亦暂不发布。

            ## 支持
            - **Android 6.0+**（minSdk 23；预编译 so 需要 API 23 的 linker 行为）
            - 竖屏 / 横屏（横屏为分体布局）

            ## 安装
            1. 下载对应架构的 APK 并安装
            2. 到「系统设置 → 语言与输入法 → 输入法」里**启用 ○输入法**并切换
            3. 首次使用会自动建立 `Documents/Oime/`（schemas / models / fonts / sounds / backup / logs）

            ## 说明
            - 本包为**社区发行版**，使用 debug 密钥签名（将来换正式密钥需先卸载再装）
            - 不含任何统计/遥测；日志只写在本机 `Documents/Oime/logs/`
            - 语音识别默认离线（需自行放入模型，见「设置 → 关于 → 使用说明」）
