name: Release

# 轮19.86：打 tag（v1.0.0 这种）时自动构建**按 ABI 拆分的发行包**并创建 GitHub Release ✓
# · 每个 ABI 一个 APK（arm64-v8a / armeabi-v7a），不含 universal 合并包 ✓
# · Release 创建用内置 GITHUB_TOKEN ✓；APK 用 **正式密钥签名**（密钥在 Secrets 里，不进仓库 ✓）
#   fork 若没有配置这些 Secrets 会自动回退 debug 签名，仍可构建 ✓
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # sherpa-onnx AAR 不入库（49MB 超 API 限制）⇒ 从官方 release 下载 ✓
      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          curl -sSL --retry 5 --retry-all-errors -o app/libs/sherpa-onnx-1.13.5.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
          ls -la app/libs/

      - name: Build release APKs (per-ABI)
        env:
          # 轮19.92：**正式发布签名** —— 密钥只存于 GitHub Secrets，不进仓库 ✓
          # （上一版补丁写错了步骤名 ⇒ env 没生效 ⇒ 线上仍是 debug 签名 ✗，本次修正 ✓）
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 轮19.92：把签名指纹打出来，一眼可核对（应为 CN=Oime 而不是 Android Debug ✓）
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "certificate DN" || true
          done

      # 按 ABI 重命名：app-<abi>-release.apk → oime-<版本>-<abi>.apk
      - name: Rename APKs
        run: |
          set -e
          mkdir -p out
          VER="${GITHUB_REF_NAME#v}"
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            abi=$(echo "$base" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$apk" "out/oime-${VER}-${abi}.apk"
          done
          ls -la out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ○输入法 ${{ github.ref_name }}
          draft: false
          # 轮19.147：**关掉自动生成** ✗ —— `generate_release_notes: true` 会把 commit 信息原样堆上去，
          # 读起来太啰嗦（用户要求：只记「本版更新了哪些功能」✓）⇒ 改用手写清单（见下方 body）✓
          generate_release_notes: false
          files: out/*.apk
          body: |
            ○输入法（Oime）${{ github.ref_name }}

            ## 本版更新（${{ github.ref_name }}）

            <!-- ★ 每次发版前更新下面这段：只列本版更新的功能，不写根因/细节 -->

            - 新增　**AI 输入**：长按符号键选「翻译 / 续写 / 润色 / 对话」，输入在 AI 条里完成
            - 新增　**AI 翻译**：边打边译，译文实时出现在输入框，回车即定稿
            - 新增　**AI 续写 / 润色 / 对话**：续写与对话输入完点「确定」出结果；润色实时生效；对话只保留最新一条回答
            - 新增　**AI 条**：真输入框，可点选、可删中间字、改字自动重译；✕ 关闭，功能与设定合为一个双段按钮
            - 新增　**AI 提供商**：与语音共用已配置的 Key，支持智谱、百炼、硅基流动、阶跃、OpenAI、Kimi、DeepSeek
            - 新增　**AI 模型拉取**：填好 Key 自动获取可用对话模型，点选即切换，也能手填
            - 新增　**AI 功能开关**：设置 → AI → AI 功能，关掉的功能不再出现在菜单里
            - 新增　定制工具栏可选「**AI**」：把 ✦ 图标放到候选栏，一键唤出功能菜单
            - 新增　**联网语音实时流式**：豆包、阶跃星辰、阿里云百炼、OpenAI 支持边说边出字
            - 新增　语音「**调用方式 ⇄ 模型**」自动对齐：选流式就只列流式模型，选整段转写就只列转写模型
            - 新增　设置里**未启用输入法**状态卡片：未启用 / 未启用且非默认 / 正常三种状态实时显示，点一下直达系统设置
            - 新增　**默认符号键盘**可选：长按符号键之外，还能在设置里指定默认打开的符号键盘
            - 变更　**翻译不读剪贴板**：只取 AI 条里输入的内容，选中文字时以选中内容为准
            - 变更　长按符号键改为 **AI 功能菜单**（默认符号键盘入口移到设置里）
            - 修复　联网语音偶发「一直在录音 / 卡住」：录音一停立即回到空闲，超时更短
            - 修复　实时语音只出一次结果的问题
            - 修复　AI 条删除源文后，输入框里残留的旧译文不消失
            - 修复　AI 条打字只落到应用输入框、进不了 AI 条的问题

            ## 下载

            | 文件 | 适用 |
            |---|---|
            | `oime-*-arm64-v8a.apk` | 64 位 ARM 机型（2016 年后的绝大多数手机）|
            | `oime-*-armeabi-v7a.apk` | **32 位 ARM 机型**（老设备；要求 Android 6.0+）|

            > 不确定就装 `arm64-v8a`；若提示「应用未安装 / 不兼容」，再装 `armeabi-v7a`。
            > x86 / x86_64 暂不发布（无设备测试）。

            ## 支持
            - **Android 6.0+**（minSdk 23；预编译 so 需要 API 23 的 linker 行为）
            - 竖屏 / 横屏（横屏沿用同一套布局，仅键高限低 25%）

            ## 安装
            1. 下载对应架构的 APK 并安装
            2. 到「系统设置 → 语言与输入法 → 输入法」里**启用 ○输入法**并切换
            3. 首次使用会自动建立 `Documents/Oime/`（schemas / models / fonts / sounds / backup / logs）

            ## 说明
            - 本包使用**正式发布密钥**签名（同一密钥持续使用，后续版本可直接覆盖升级 ✓）
            - 若你装过 **debug 签名**的旧版本（0.9.x / 早期 1.0.0），需**先卸载**再装本包 ✓
            - 不含任何统计/遥测；日志只写在本机 `Documents/Oime/logs/`
            - **AI 与联网语音的 API Key 只存本机**，不进备份、不随换机迁移 ⇒ 换机 / 恢复出厂后需重新填写
            - AI 功能默认使用你配置的提供商，文本会发送到你选择的服务；不想联网可不开 AI，输入法本身仍是全离线
