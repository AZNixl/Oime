name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        # 轮19.45：仓库已改为 **public** ⇒ GitHub Actions 的分钟与存储**全部免费**
        # （官方：usage is free for public repositories / standard GitHub-hosted runners），
        # 因此把 gradle 缓存加回来，构建快 1~2 分钟。私有仓库时它曾撑爆 500MB 额度。
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 轮19：sherpa-onnx AAR 不进 repo（49MB 超 API 限制），CI 直连官方 release 下载
    - name: Download sherpa-onnx AAR
      run: |
        mkdir -p app/libs
        curl -sSL --retry 5 --retry-all-errors -o app/libs/sherpa-onnx-1.13.5.aar \
          https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
        ls -la app/libs/

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        # 轮19.37：**产物保留 3 天**——之前累积 99 个 APK（2.4GB）撑爆免费账号的
        # 500MB 产物配额，导致「Upload APK」步骤失败（构建本身是成功的）。
        retention-days: 3
        if-no-files-found: error

    - name: Upload build reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-reports
        path: app/build/reports/
        # 轮19.39c：构建失败时该目录常不存在 → 用 ignore 消掉 "No files were found" 警告
        if-no-files-found: ignore
        retention-days: 3
